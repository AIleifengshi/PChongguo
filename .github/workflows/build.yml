name: Package PC Player

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify payload
        shell: pwsh
        run: |
          $required = @(
            'pc/PChongguo.vbs',
            'pc/PChongguo.ico',
            'pc/SETUP.bat',
            'pc/使用说明.txt',
            'pc/分享给朋友.html'
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing payload file: $f" }
          }
          Get-ChildItem pc | Select-Object Name, Length

      - name: Package as ZIP
        shell: pwsh
        run: Compress-Archive -Path "pc/*" -DestinationPath "PChongguo-PC.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PChongguo-PC
          path: PChongguo-PC.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "PChongguo PC 追剧版"
          body: |
            ## PChongguo · 电脑大屏追红果短剧

            双击即用的独立追剧窗口，无需安装、无需登录即可观看。

            ### 安装（约 10 秒）
            1. 下载 `PChongguo-PC.zip`
            2. 解压到桌面或 D 盘等普通目录（不要放 `C:\Program Files`）
            3. 双击 `PChongguo.vbs` → 直接看到剧集封面墙
            4. 点一部剧 → 点「播放正片」→ 开始播放

            首次运行会自动在桌面生成 `PChongguo` 快捷方式。
            若双击 .vbs 无反应，可改用 `SETUP.bat` 生成快捷方式。

            ### 本次修复
            - 旧版把推广落地页当播放地址且使用手机 UA，官网强制拦截成「请下载 App」，导致白屏/看不到剧
            - 新版直接打开红果官网网页版并使用桌面 UA，官网正常给出播放器，实测可播放（H.264，无需 HEVC 扩展）
            - 移除 163MB Electron 套壳；改用系统自带 Edge 独立窗口，整个程序仅几十 KB
            - 播放时若弹出「登录发现更多精彩内容」，点右上角 × 关闭即可，无需登录

            ### 环境要求
            Windows 10/11 + Microsoft Edge（系统自带）。
            短剧内容与播放规则归红果短剧官方所有，本程序仅是电脑端观看入口。
          files: PChongguo-PC.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
