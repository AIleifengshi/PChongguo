name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_INSTALL: '1'
      ELECTRON_MIRROR: 'https://registry.npmmirror.com/-/binary/electron/'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build EXE (nativefier)
        run: npm run build

      - name: Rename to brand name
        run: node rename.js

      - name: Package as ZIP
        run: Compress-Archive -Path "dist/PCHongguo-win32-x64" -DestinationPath "PCHongguo-win32-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCHongguo-win32-x64
          path: PCHongguo-win32-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PCHongguo-win32-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
