name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_INSTALL: '1'
      ELECTRON_MIRROR: 'https://registry.npmmirror.com/-/binary/electron/'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build EXE (nativefier)
        run: npm run build

      - name: Rename to brand name
        run: |
          Rename-Item "dist/AILFF-win32-x64" "AI类风湿-win32-x64"
          Rename-Item "dist/AI类风湿-win32-x64/AILFF.exe" "AI类风湿.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI类风湿-win32-x64
          path: dist/**

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AI类风湿-win32-x64/AI类风湿.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
