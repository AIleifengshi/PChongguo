name: Package PC Player

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify payload
        shell: pwsh
        run: |
          $required = @(
            'pc/PChongguo.vbs',
            'pc/PChongguo.ico',
            'pc/SETUP.bat',
            'pc/使用说明.txt',
            'pc/分享给朋友.html',
            'pc/channels.html',
            'pc/fullwatch.html',
            'pc/fullmode.html',
            'pc/INSTALL-ENGINE.bat',
            'pc/START-FULLMODE.bat',
            'pc/mycode.png',
            'pc/promo-url.txt'
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing payload file: $f" }
          }
          # Guard: the promo QR must be a real PNG and non-trivial in size.
          $qr = Get-Item 'pc/mycode.png'
          if ($qr.Length -lt 2000) { throw "mycode.png looks invalid" }
          # Guard: never bundle the optional third-party engine or local profile.
          if (Test-Path 'pc/engine') { throw "pc/engine must not be committed" }
          Get-ChildItem pc -File | Select-Object Name, Length

      - name: Package as ZIP
        shell: pwsh
        run: |
          # Stage only plain files: excludes pc/Profile, pc/engine and any .lnk.
          $stage = Join-Path $env:RUNNER_TEMP 'pcpayload'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem 'pc' -File | Copy-Item -Destination $stage -Force
          Compress-Archive -Path "$stage/*" -DestinationPath "PChongguo-PC.zip" -Force
          Get-Item "PChongguo-PC.zip" | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PChongguo-PC
          path: PChongguo-PC.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "PChongguo v4.0 · 全集模式版"
          body: |
            ## PChongguo v4.0 · 全集模式版

            双击即用的独立追剧窗口。**v4 新增「全集模式」：电脑上真能把一部剧从头看到尾**，不再只看官网网页版开放的前 5 集。

            ### 安装（约 10 秒）
            1. 下载 `PChongguo-PC.zip`
            2. 解压到桌面或 D 盘等普通目录（不要放 `C:\Program Files`）
            3. 双击 `PChongguo.vbs` → 剧集封面墙 → 点一部剧 → 点「播放正片」
            4. 首次运行生成三个桌面图标：`PChongguo`、`PChongguo-Full`（频道首页）、`PChongguo-FullSeries`（全集模式）

            若双击 .vbs 无反应，改用 `SETUP.bat`。

            ### 全集模式（可选，安装一次）
            - 双击 `INSTALL-ENGINE.bat` → 从上游作者官方 GitHub Release 下载约 17 MB 的第三方免费引擎，解压到本目录 `engine\`
            - 双击 `START-FULLMODE.bat` 或桌面 `PChongguo-FullSeries` 图标即可看全集
            - 详见 `fullmode.html`（来源、安全、无推广归因说明）

            ### 为什么需要它
            官网网页版只是试看：实测把取流接口的 `item_id` 换成第 12 集会返回 `403 public_fallback_unavailable`；带 cookie 走真实路径进第 12 集播放页，请求体仍是第 1 集 vid。`accessible_episode_cnt: 5` 是服务端硬墙，改前端绕不过。
            红果 App 内全剧本来免费，第三方桌面客户端自行注册设备、调 App 端接口并解密视频流，因此能看全 999 集。v4 把它作为可选组件接进来，而不是做一个假的「免费」频道。

            ### 重要边界
            - **本 Release 不含任何第三方 exe**，只有几十 KB 的网页与脚本；引擎由用户自行点安装下载到本机
            - 已核实该引擎不含 `invite_code` / `kol_uid` / `appId`，打开它不会给别人带量
            - 引擎未签名，杀软可能误报；是否加白名单由用户自行决定，本程序不改安全软件设置
            - 上游接口常变，可能突然播不了，需重跑安装脚本或等上游更新
            - **全集模式与收益无关**：收益仍只走 `fullwatch.html` 里用户自己的推广码，结算只在官方 App 内闭环
            - 不破解网页锁、不篡改官网页面、不替换官网动态二维码、不伪造登录态、不分发任何剧集文件
            - 抖音公开内容不要放二维码 / 网址 / 外链 / 「发给 AI 就装」暗语

            ### 环境要求
            Windows 10/11 + Microsoft Edge（系统自带）。
            短剧内容、播放规则与推广结算规则归红果短剧官方所有；全集模式使用的第三方引擎是独立软件，由用户自行选择安装并自行判断可用性与安全性。
          files: PChongguo-PC.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
