name: Package PC Player

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify payload
        shell: pwsh
        run: |
          $required = @(
            'pc/PChongguo.vbs',
            'pc/PChongguo.ico',
            'pc/SETUP.bat',
            'pc/使用说明.txt',
            'pc/分享给朋友.html',
            'pc/channels.html',
            'pc/fullwatch.html',
            'pc/mycode.png',
            'pc/promo-url.txt'
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing payload file: $f" }
          }
          # Guard: the promo QR must be a real PNG and non-trivial in size.
          $qr = Get-Item 'pc/mycode.png'
          if ($qr.Length -lt 2000) { throw "mycode.png looks invalid" }
          Get-ChildItem pc | Select-Object Name, Length

      - name: Package as ZIP
        shell: pwsh
        run: Compress-Archive -Path "pc/*" -DestinationPath "PChongguo-PC.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PChongguo-PC
          path: PChongguo-PC.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "PChongguo v3.1 · 频道版"
          body: |
            ## PChongguo v3.1 · 频道版

            双击即用的独立追剧窗口，新增**频道首页**与「免费看全集」入口，并内置你自己的推广码。

            ### 安装（约 10 秒）
            1. 下载 `PChongguo-PC.zip`
            2. 解压到桌面或 D 盘等普通目录（不要放 `C:\Program Files`）
            3. 双击 `PChongguo.vbs` → 剧集封面墙 → 点一部剧 → 点「播放正片」
            4. 首次运行会在桌面生成两个图标：`PChongguo`（追剧）、`PChongguo-Full`（频道首页）

            若双击 .vbs 无反应，可改用 `SETUP.bat`；也可直接双击 `channels.html` 或 `fullwatch.html`。

            ### v3.1 更新
            - 新增 `channels.html` 频道首页：真人剧 / AI剧 / 漫剧 / 漫画 / 热播榜 / 官网首页 一键直达官网真实分类，每格标注「网页试看前 5 集 · 全集在 App」
            - 频道首页含醒目的「免费看全集」入口，指向 `fullwatch.html` 的两条合规路径
            - `fullwatch.html` 顶部新增「官网锁集码 vs 你自己的码」对比（位置 / 外观 / 链接 / 有无推广参数 / 结果），避免扫错码
            - 第二个桌面快捷方式改指向频道首页；使用说明 / README 同步

            ### 为什么没有做一个叫「免费」的频道
            逐部实测：AI剧 / 漫剧 / 真人剧点「播放正片」视频正常加载，但点第 12 集后视频地址不变、不加载，播放区变「扫码进入App端，免费看全集」，选集 6–10 带锁，三部剧结果一字不差。官网 90 个分类链接中也没有 free 频道。
            「高清完整版全集免费观看」是 SEO 标题模板，「全60集免费观看」是手机 App 内标签，官网侧栏写的是「App 免费高清看全集」—— 三处都指 App，不是网页版。做一个假的「免费」网页频道属于虚假宣传，本程序不做。

            ### 必须知道的事实
            - 官网网页版只是试看，网页端没有官方全集解锁入口，官方也没有 Windows 客户端
            - 推广归因只在手机 App 内闭环，电脑网页播放与 GitHub 下载量不产生收益
            - 电脑端看全集的合规路径：安卓模拟器内运行官方 App（风控可能不结算），或手机 App 投屏到电脑大屏（最稳）
            - 官网锁集弹窗里的码是动态唤端链接、不含推广参数，本程序不替换、不篡改、不破解锁集
            - 不要自己扫自己的码；抖音公开内容不要放二维码 / 网址 / 外链 / 暗语

            ### 环境要求
            Windows 10/11 + Microsoft Edge（系统自带）。
            短剧内容、播放规则与推广结算规则归红果短剧官方所有，本程序仅是电脑端观看入口。
          files: PChongguo-PC.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
